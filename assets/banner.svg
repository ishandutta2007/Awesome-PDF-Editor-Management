<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="auto">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1035" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <radialGradient id="glowRed" cx="20%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowPurple" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowCyan" cx="60%" cy="20%" r="40%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <style>
      @keyframes floatSlow1 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-10px) rotate(1deg); }
      }
      @keyframes floatSlow2 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-14px) rotate(-1.5deg); }
      }
      @keyframes floatSlow3 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes pulseBeam {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.6; transform: scale(1.04); }
      }
      @keyframes dashAnim {
        to { stroke-dashoffset: -40; }
      }
      @keyframes shimmer {
        0% { stop-color: #f43f5e; }
        50% { stop-color: #38bdf8; }
        100% { stop-color: #f43f5e; }
      }

      .floating-pill-1 { animation: floatSlow1 6s ease-in-out infinite; }
      .floating-pill-2 { animation: floatSlow2 7.5s ease-in-out infinite 1s; }
      .floating-pill-3 { animation: floatSlow3 5.5s ease-in-out infinite 0.5s; }
      .floating-pill-4 { animation: floatSlow1 8s ease-in-out infinite 2s; }
      .floating-pill-5 { animation: floatSlow2 6.5s ease-in-out infinite 1.5s; }
      .pulse-glow { animation: pulseBeam 8s ease-in-out infinite; transform-origin: center; }
      .flow-line { stroke-dasharray: 6 6; animation: dashAnim 4s linear infinite; }

      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-size: 46px;
        font-weight: 800;
        fill: #ffffff;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-size: 20px;
        font-weight: 400;
        fill: #94a3b8;
      }
      .pill-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-size: 13px;
        font-weight: 600;
        fill: #e2e8f0;
      }
      .badge-title {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-size: 13px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        fill: #38bdf8;
      }
    </style>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="420" rx="16" fill="none" stroke="#334155" stroke-width="1.5" />

  <!-- Ambient Dynamic Glow Lights (in background) -->
  <circle cx="200" cy="120" r="280" fill="url(#glowRed)" class="pulse-glow" />
  <circle cx="1020" cy="300" r="320" fill="url(#glowPurple)" class="pulse-glow" />
  <circle cx="700" cy="90" r="220" fill="url(#glowCyan)" class="pulse-glow" />

  <!-- Decorative Matrix / Background Graph Lines -->
  <g opacity="0.15">
    <line x1="100" y1="0" x2="100" y2="420" stroke="#94a3b8" stroke-width="1" />
    <line x1="300" y1="0" x2="300" y2="420" stroke="#94a3b8" stroke-width="1" />
    <line x1="500" y1="0" x2="500" y2="420" stroke="#94a3b8" stroke-width="1" />
    <line x1="700" y1="0" x2="700" y2="420" stroke="#94a3b8" stroke-width="1" />
    <line x1="900" y1="0" x2="900" y2="420" stroke="#94a3b8" stroke-width="1" />
    <line x1="1100" y1="0" x2="1100" y2="420" stroke="#94a3b8" stroke-width="1" />
    <line x1="0" y1="100" x2="1200" y2="100" stroke="#94a3b8" stroke-width="1" />
    <line x1="0" y1="200" x2="1200" y2="200" stroke="#94a3b8" stroke-width="1" />
    <line x1="0" y1="300" x2="1200" y2="300" stroke="#94a3b8" stroke-width="1" />
  </g>

  <!-- Dynamic Connecting Data Circuit (Underneath) -->
  <path d="M 120 330 C 250 370, 400 350, 600 365 C 800 380, 950 330, 1080 345" fill="none" stroke="#6366f1" stroke-width="2" class="flow-line" opacity="0.4" />

  <!-- DYNAMIC / ANIMATED ACCENT PILLS (Positioned around borders to avoid obstructing center text) -->
  <!-- Pill 1: Top Right Self-Hosted -->
  <g class="floating-pill-1" filter="url(#subtleShadow)">
    <rect x="910" y="45" width="220" height="42" rx="21" fill="url(#cardGrad)" stroke="#6366f1" stroke-width="1.5" />
    <circle cx="932" cy="66" r="6" fill="#10b981" />
    <text x="948" y="71" class="pill-text">🐳 Docker &amp; Self-Hosted</text>
  </g>

  <!-- Pill 2: Bottom Right Privacy / Local -->
  <g class="floating-pill-2" filter="url(#subtleShadow)">
    <rect x="900" y="325" width="230" height="42" rx="21" fill="url(#cardGrad)" stroke="#f43f5e" stroke-width="1.5" />
    <circle cx="922" cy="346" r="6" fill="#f43f5e" />
    <text x="938" y="351" class="pill-text">🔒 Browser-Local &amp; Offline</text>
  </g>

  <!-- Pill 3: Top Left OCR -->
  <g class="floating-pill-3" filter="url(#subtleShadow)">
    <rect x="70" y="45" width="200" height="42" rx="21" fill="url(#cardGrad)" stroke="#06b6d4" stroke-width="1.5" />
    <circle cx="92" cy="66" r="6" fill="#06b6d4" />
    <text x="108" y="71" class="pill-text">🔍 AI OCR &amp; Redaction</text>
  </g>

  <!-- Pill 4: Bottom Left Merge / Split -->
  <g class="floating-pill-4" filter="url(#subtleShadow)">
    <rect x="70" y="325" width="210" height="42" rx="21" fill="url(#cardGrad)" stroke="#8b5cf6" stroke-width="1.5" />
    <circle cx="92" cy="346" r="6" fill="#8b5cf6" />
    <text x="108" y="351" class="pill-text">⚡ Split, Merge &amp; Rotate</text>
  </g>

  <!-- Pill 5: Bottom Center E-Sign -->
  <g class="floating-pill-5" filter="url(#subtleShadow)">
    <rect x="490" y="345" width="220" height="40" rx="20" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="512" cy="365" r="6" fill="#38bdf8" />
    <text x="528" y="370" class="pill-text">✍️ Digital Signatures &amp; Forms</text>
  </g>

  <!-- FOREGROUND PRIMARY CONTENT (Guaranteed clean, high contrast, uncluttered) -->
  <g id="foreground-content" transform="translate(600, 150)" text-anchor="middle">
    <!-- Category Pill -->
    <rect x="-140" y="-48" width="280" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity="0.9" />
    <text x="0" y="-28" text-anchor="middle" class="badge-title">CURATED DEVELOPER ECOSYSTEM</text>

    <!-- Main Title with Glowing Gradient Accent Underline -->
    <text x="0" y="40" class="title-text" filter="url(#subtleShadow)">
      Awesome PDF Editor &amp; Management
    </text>

    <!-- Gradient Accent Underline Bar -->
    <rect x="-260" y="60" width="520" height="4" rx="2" fill="url(#primaryGrad)" />

    <!-- Subtitle Text -->
    <text x="0" y="102" class="subtitle-text">
      The definitive directory of Self-Hosted Toolkits, Open-Source Engines &amp; Enterprise SaaS
    </text>
  </g>
</svg>
